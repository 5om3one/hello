<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>Hello You</title>
    <style>
        body {
            background-color: #000;
            color: #fff;
            font-family: monospace;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            margin: 0;
            overflow: hidden;
            user-select: none;
        }

        .eyes-container {
            display: flex;
            justify-content: space-between;
            width: 140px;
            margin-bottom: 40px;
        }
        .eye {
            width: 35px;
            height: 35px;
            background-color: #fff;
            border-radius: 50%;
            transition: transform 0.1s;
        }

        .dialogue-container {
            font-size: 20px;
            text-align: center;
            max-width: 650px;
            height: 80px;
            margin-bottom: 40px;
            line-height: 1.5;
        }

        .blocks-container {
            display: none;
            grid-template-columns: repeat(2, 1fr);
            gap: 20px;
            width: 90%;
            max-width: 500px;
        }
        .quest-block {
            background-color: #222;
            border: 2px solid #444;
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 12px;
            cursor: default;
            transition: background-color 0.3s, border-color 0.3s;
        }
        .quest-block .block-title {
            font-size: 24px;
            font-weight: bold;
            color: #888;
        }

        .quest-block input {
            background: #111;
            border: 1px solid #555;
            color: #fff;
            padding: 6px;
            font-family: monospace;
            text-align: center;
            width: 80%;
            font-size: 14px;
        }
        .quest-block button {
            background: #333;
            border: 1px solid #555;
            color: #fff;
            cursor: pointer;
            font-family: monospace;
            padding: 5px 12px;
        }
        .quest-block button:hover { background: #444; }

        .quest-block.unlocked {
            background-color: #000;
            border-color: #fff;
            cursor: pointer;
        }
        .quest-block.unlocked .block-title {
            color: #fff;
        }
        .quest-block.unlocked input, 
        .quest-block.unlocked button {
            display: none;
        }

        .overlay-screen {
            display: none;
            flex-direction: column;
            align-items: center;
            gap: 25px;
        }
        .confirm-text {
            font-size: 24px;
            letter-spacing: 2px;
        }
        .buttons-group {
            display: flex;
            gap: 40px;
        }
        .action-btn {
            background: none;
            border: 2px solid #fff;
            color: #fff;
            font-family: monospace;
            font-size: 20px;
            padding: 8px 25px;
            cursor: pointer;
            transition: background 0.2s, color 0.2s;
        }
        .action-btn:hover {
            background: #fff;
            color: #000;
        }

        #glitch-voice {
            color: #ff0000;
            font-weight: bold;
            font-size: 24px;
            text-shadow: 0 0 10px #ff0000;
            display: none;
            text-align: center;
        }
    </style>
</head>
<body>

    <div class="eyes-container">
        <div class="eye" id="left-eye"></div>
        <div class="eye" id="right-eye"></div>
    </div>

    <div class="dialogue-container" id="dialogue-box"></div>

    <div class="overlay-screen" id="confirm-screen">
        <div class="confirm-text" id="confirm-label"></div>
        <div class="buttons-group">
            <button class="action-btn" id="btn-yes" onclick="finalDecision(true)"></button>
            <button class="action-btn" id="btn-no" onclick="finalDecision(false)"></button>
        </div>
    </div>

    <div id="glitch-voice"></div>

    <div class="blocks-container" id="blocks-wrapper">
        <div class="quest-block" id="block-A" onclick="handleBlockClick('A')">
            <div class="block-title">A</div>
            <input type="password" id="input-A" placeholder="" onclick="event.stopPropagation()">
            <button id="submit-A" onclick="checkPassword('A', event)"></button>
        </div>
        <div class="quest-block" id="block-B" onclick="handleBlockClick('B')">
            <div class="block-title">B</div>
            <input type="password" id="input-B" placeholder="" onclick="event.stopPropagation()">
            <button id="submit-B" onclick="checkPassword('B', event)"></button>
        </div>
        <div class="quest-block" id="block-C" onclick="handleBlockClick('C')">
            <div class="block-title">C</div>
            <input type="password" id="input-C" placeholder="" onclick="event.stopPropagation()">
            <button id="submit-C" onclick="checkPassword('C', event)"></button>
        </div>
        <div class="quest-block" id="block-D" onclick="handleBlockClick('D')">
            <div class="block-title">D</div>
            <input type="password" id="input-D" placeholder="" onclick="event.stopPropagation()">
            <button id="submit-D" onclick="checkPassword('D', event)"></button>
        </div>
    </div>

    <script>
        function decodeText(base64Str) {
            return decodeURIComponent(atob(base64Str).split('').map(function(c) {
                return '%' + ('00' + c.charCodeAt(0).toString(16)).slice(-2);
            }).join(''));
        }

        const uiText = {
            confirm: "0JLQu9C1INGD0LLQtdGA0LXQvdGLPw==",
            yes: "0JTQsA==",
            no: "0J3QtdGCRg==",
            reply: "0J7RgtCy0LXRgtC40YLRjA==",
            alertErr: "0JTQvtGB0YLRg9C_INC30LDQv9GA0LXRidC10L0uINCd0LXQstC10YDQvdGL0Lkg0LrQu9GO0Ycu",
            glitchVoice: "Li4u" // исправлено на корректный Base64 ("...")
        };

        const linesEnc = [
            "0J_RgNC40LLQtdGC0YHRgtCy0YPRjtGO",
            "0JLQvtGCINC80Ysg0Lgg0LLRgdGC0YDQtdGC0LjQu9C40YHRjCDQu9C40YbQvtC8INC6INC70LjRhtGD",
            "0K8g0YPQttC1INC00LDQstC90L4g0L3QsNCx0LvRjtC00LDRjtYg0LfQsCDQstCw0LzQuA==",
            "0Jgg0LrQsNC6INCy0LjQttGDLCDQstGLINC20LDQttC00LXRgtC1INGD0LfQvdCw0YLRjCDQvtGC0LLQtdGC0Yv+",
            "0K8g0L_QvtC30LLQvtC70Y4g0LLQsNC8INGD0LfQvdCw0YLRjCDQvtGC0LLQtdGCLi4u",
            "0L3QviDRgtC-0LvRjNC60L4g0L3QsCDQvtC00LjQvCDQstC-0L_RgNC-0YE="
        ];

        const passwordsEnc = {
            A: "MTIxMzI=",
            B: "NzY1OA==",
            C: "MTI3Mg==",
            D: "ODM0"
        };

        const npcAnswersEnc = {
            A: "0JfQstGD0LrQuCDQuCDQv9C-0LzQtdGF0LgsINC60L7RgtC-0YDRi9C1INCy0Ysg0YHQu9GL0YjQsNC70Lgg4oCUINGN0YLQviDQvdC1INC_0YDQvtGB0YLQviDRhdCw0L7RgS4g0JL_0LrQsNC20LTQvtC8INGI0L7RgC-0YXQtSDQvtGB0L7QsdC90Y_QutCwINGB0LrRgNGL0LLQsNC10YLRgdGPINC10ZEg0LrRgNC40LouINCd0L4g0LjRgdGC0LjQvdC90YvQuSDRgdC80YvRgdC7INGI0YPQvNCwINCy0Ysg0L7RgdC-0LfQvdCw0LXRgtC10L_QvtC00LfQtdC_Lg==",
            B: "0JjRgNC10L0g4oCUINGN0YLQviDQtNC40YLRjCwg0YDQvtC20LTQtdC90L3QvtC1INC_0L7QtCDQvdC10YHRh9Cw0YHRgtC70LjQstC-0Lkg0LfQstC10LfQtNC-0LkgMjkg0YLRkdCy0YDQsCw0LvRiy4g0JHQtdGB0L_QvtC60L7QudC90LDRjyDRg9GI0LAsINC30LDRgdGC0Y_PRNCw0YjQuNGB0Y8g0LIg0L_Qu9Cw0LzQtdC90Lgg0YHQvtCx0YHRgtCy0LXQvdC90LrQuNC5INC80LXRgdGC0LguINC-0L3QsCDQuCDQtdGB0YLRjCDRjdGC0L7Riywg0L7RgdC-0LHQvdGP0LrRgy4=",
            C: "0K8g0YLQvtC9LCDQutGC0L4g0YHRgtGA0L7QuNC7INGN0YLQuCDQutC-0YDQuNC00L7RgNGLINC00L4g0YLQvtCz0L4sINC60LDQuiDQvtC90Lgg0YHQv9Cw0LLQuNC70LguINCS0YHQtdC10LQg0LfQsNCx0LvRjtC00LDQuyDQt9CwINC10Ycg0LrQvtC90YbQvtCyLCDQuCDRjyDQvdCw0LHQu9GO0LTQsNGOINC30LAg0LLQsNGI0LDQvNC4INC90LDRh9Cw0LvQvtC8Lg=="
        };

        const speechPartsDEnc = [
            "0JLRiyDQvNC-0LbQtdGC0LUg0L_QvtC00YPQvNCw0YLRjCwg0YfRgtC-INCy0LXRgdGMINC_0YDQvtC00LXQu9Cw0L3QvdGL0Lkg0LLQsNC80Lgg0L_Rg9GC0Ywg0LHQtdGB0YHQvNGL0YHQu9C10L0g0Lgg0LIg0YbQtdC70L7QvCwg0YLQsNC6INC4INC10YHRgtGMLCDQvdC-INC_0L7QtNGD0LzQsNC50YLQtSwg0YHQutC-0LvRjNC60L4g0Y3QvNC-0YbQuNC5INCy0Ysg0L_QvtC70YPRh9C40LvQuCwg0YHQutC-0LvRjNC60L4g0LfQsNCy0LXQu9C4INC90L7QstGL0YUg0LTRgNGD0LfQtdC5LCDRgNCw0LfQstC1INGN0YLQviDRgtC-0LPQviDQvdC1INGB0YLQvtC40YI_",
            "0KXQvtGC0Ywg0LLRiyDQuCDQv9C-0YLRgNCw0YLQuNC70Lgg0LLRgNC10LzRjCwg0LIg0L7QttC40LTQsNC90LjQuCDQvtGC0LLQtdGC0L7Qsiwg0LLRiyDQstGB0ZHQttC1INC90LjQutC-0LPQtNCwINC90Lgg0LfQsNCx0YPQtNC10YLQtSDQutCw0Log0YDQtdGI0LDQu9C4INGN0YLRg9C_0LfQsNCz0LDQtNC60YMu",
            "0Jgg0LTQsC4uLiDQmtCw0Log0LHRiyDRjdGC0L4g0L3QtSDQsdGL0LvQviDQsyDRgNGD0YHRgtC90L4sINC90L4g0LLQsNGI0LUg0L_Rg9GC0LXRiNC10YHRgtCy0LjQtS4uLg=="
        ];

        let currentLine = 0;
        let selectedBlock = null;
        let currentPartIndex = 0;

        function blinkEyes() {
            const leftEye = document.getElementById('left-eye');
            const rightEye = document.getElementById('right-eye');
            function doBlink() {
                leftEye.style.transform = 'scaleY(0)';
                rightEye.style.transform = 'scaleY(0)';
                setTimeout(() => {
                    leftEye.style.transform = 'scaleY(1)';
                    rightEye.style.transform = 'scaleY(1)';
                    setTimeout(doBlink, Math.random() * 3000 + 2000);
                }, 150);
            }
            setTimeout(doBlink, Math.random() * 3000 + 2000);
        }

        function typeText(text, elementId, callback) {
            const el = document.getElementById(elementId);
            if (!el) return;
            el.innerHTML = "";
            let i = 0;
            function type() {
                if (i < text.length) {
                    el.innerHTML += text.charAt(i);
                    i++;
                    setTimeout(type, 40);
                } else if (callback) {
                    setTimeout(callback, 1500);
                }
            }
            type();
        }

        function runDialogue() {
            if (currentLine < linesEnc.length) {
                typeText(decodeText(linesEnc[currentLine]), "dialogue-box", () => {
                    currentLine++;
                    runDialogue();
                });
            } else {
                localStorage.setItem("arg_dialogue_finished", "true");
                showBlocks();
            }
        }

        function showBlocks() {
            document.getElementById("dialogue-box").innerHTML = "";
            document.getElementById("blocks-wrapper").style.display = "grid";
        }

        function checkPassword(letter, event) {
            event.stopPropagation();
            const inputVal = document.getElementById(`input-${letter}`).value.trim();

            if (inputVal === decodeText(passwordsEnc[letter])) {
                localStorage.setItem(`arg_unlocked_${letter}`, "true");
                unlockBlockVisuals(letter);
            } else {
                alert(decodeText(uiText.alertErr));
                document.getElementById(`input-${letter}`).value = "";
            }
        }

        function unlockBlockVisuals(letter) {
            const block = document.getElementById(`block-${letter}`);
            if (block) block.classList.add("unlocked");
        }

        function handleBlockClick(letter) {
            const block = document.getElementById(`block-${letter}`);
            if (!block || !block.classList.contains("unlocked")) return;

            selectedBlock = letter;
            document.getElementById("blocks-wrapper").style.display = "none";
            document.getElementById("confirm-screen").style.display = "flex";
        }

        function finalDecision(isYes) {
            if (!isYes) {
                document.getElementById("confirm-screen").style.display = "none";
                document.getElementById("blocks-wrapper").style.display = "grid";
                selectedBlock = null;
                return;
            }

            localStorage.setItem("arg_final_choice", selectedBlock);
            document.getElementById("confirm-screen").style.display = "none";
            displayFinalAnswer(selectedBlock);
        }

        function typeSpeechDParts() {
            if (currentPartIndex < speechPartsDEnc.length) {
                typeText(decodeText(speechPartsDEnc[currentPartIndex]), "dialogue-box", () => {
                    setTimeout(() => {
                        currentPartIndex++;
                        typeSpeechDParts();
                    }, 2500);
                });
            } else {
                setTimeout(() => {
                    const eyes = document.querySelector(".eyes-container");
                    if (eyes) eyes.style.display = "none";
                    document.getElementById("dialogue-box").style.display = "none";
                    document.getElementById("glitch-voice").style.display = "block";
                }, 4000);
            }
        }

        function displayFinalAnswer(letter) {
            document.getElementById("blocks-wrapper").style.display = "none";
            document.getElementById("confirm-screen").style.display = "none";

            if (letter === 'D') {
                currentPartIndex = 0;
                typeSpeechDParts();
            } else {
                typeText(decodeText(npcAnswersEnc[letter]), "dialogue-box");
            }
        }

        function initInterfaceText() {
            document.getElementById("confirm-label").innerText = decodeText(uiText.confirm);
            document.getElementById("btn-yes").innerText = decodeText(uiText.yes);
            document.getElementById("btn-no").innerText = decodeText(uiText.no);
            document.getElementById("glitch-voice").innerText = decodeText(uiText.glitchVoice);
            ['A', 'B', 'C', 'D'].forEach(letter => {
                const btn = document.getElementById(`submit-${letter}`);
                if (btn) btn.innerText = decodeText(uiText.reply);
            });
        }

        window.onload = function() {
            initInterfaceText();
            blinkEyes();

            const savedChoice = localStorage.getItem("arg_final_choice");
            if (savedChoice) {
                displayFinalAnswer(savedChoice);
                return;
            }

            ['A', 'B', 'C', 'D'].forEach(letter => {
                if (localStorage.getItem(`arg_unlocked_${letter}`) === "true") {
                    unlockBlockVisuals(letter);
                }
            });

            if (localStorage.getItem("arg_dialogue_finished") === "true") {
                showBlocks();
            } else {
                runDialogue();
            }
        };
    </script>
</body>
</html>
