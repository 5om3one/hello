<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>Hello</title>
    <style>
        body {
            background-color: #000;
            color: #fff;
            font-family: monospace;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            margin: 0;
            overflow: hidden;
            user-select: none;
        }

        .eyes-container {
            display: flex;
            justify-content: space-between;
            width: 140px;
            margin-bottom: 40px;
        }
        .eye {
            width: 35px;
            height: 35px;
            background-color: #fff;
            border-radius: 50%;
            transition: transform 0.1s;
        }

        .dialogue-container {
            font-size: 20px;
            text-align: center;
            max-width: 650px;
            height: 80px;
            margin-bottom: 40px;
            line-height: 1.5;
        }

        .blocks-container {
            display: none;
            grid-template-columns: repeat(2, 1fr);
            gap: 20px;
            width: 90%;
            max-width: 500px;
        }
        .quest-block {
            background-color: #222;
            border: 2px solid #444;
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 12px;
            cursor: default;
            transition: background-color 0.3s, border-color 0.3s;
        }
        .quest-block .block-title {
            font-size: 24px;
            font-weight: bold;
            color: #888;
        }

        .quest-block input {
            background: #111;
            border: 1px solid #555;
            color: #fff;
            padding: 6px;
            font-family: monospace;
            text-align: center;
            width: 80%;
            font-size: 14px;
        }
        .quest-block button {
            background: #333;
            border: 1px solid #555;
            color: #fff;
            cursor: pointer;
            font-family: monospace;
            padding: 5px 12px;
        }
        .quest-block button { display: none; }
        .quest-block button:hover { background: #444; }

        .quest-block.unlocked {
            background-color: #000;
            border-color: #fff;
            cursor: pointer;
        }
        .quest-block.unlocked .block-title {
            color: #fff;
        }
        .quest-block.unlocked input, 
        .quest-block.unlocked button {
            display: none;
        }

        .overlay-screen {
            display: none;
            flex-direction: column;
            align-items: center;
            gap: 25px;
        }
        .confirm-text {
            font-size: 24px;
            letter-spacing: 2px;
        }
        .buttons-group {
            display: flex;
            gap: 40px;
        }
        .action-btn {
            background: none;
            border: 2px solid #fff;
            color: #fff;
            font-family: monospace;
            font-size: 20px;
            padding: 8px 25px;
            cursor: pointer;
            transition: background 0.2s, color 0.2s;
        }
        .action-btn:hover {
            background: #fff;
            color: #000;
        }

        .other-voice {
            font-family: Georgia, "Times New Roman", serif;
            font-style: italic;
            font-weight: bold;
            letter-spacing: 3px;
        }

        #glitch-voice {
            color: #ff0000;
            font-weight: bold;
            font-size: 24px;
            text-shadow: 0 0 10px #ff0000;
            display: none;
            text-align: center;
        }
    </style>
</head>
<body>

    <div class="eyes-container">
        <div class="eye" id="left-eye"></div>
        <div class="eye" id="right-eye"></div>
    </div>

    <div class="dialogue-container" id="dialogue-box"></div>

    <div class="overlay-screen" id="confirm-screen">
        <div class="confirm-text" id="confirm-label"></div>
        <div class="buttons-group">
            <button class="action-btn" id="btn-yes" onclick="finalDecision(true)"></button>
            <button class="action-btn" id="btn-no" onclick="finalDecision(false)"></button>
        </div>
    </div>

    <div id="glitch-voice"></div>

    <div class="blocks-container" id="blocks-wrapper">
        <div class="quest-block" id="block-A" onclick="handleBlockClick('A')">
            <div class="block-title">A</div>
            <input type="password" id="input-A" placeholder="" onclick="event.stopPropagation()">
            <button id="submit-A" onclick="checkPassword('A', event)"></button>
        </div>
        <div class="quest-block" id="block-B" onclick="handleBlockClick('B')">
            <div class="block-title">B</div>
            <input type="password" id="input-B" placeholder="" onclick="event.stopPropagation()">
            <button id="submit-B" onclick="checkPassword('B', event)"></button>
        </div>
        <div class="quest-block" id="block-C" onclick="handleBlockClick('C')">
            <div class="block-title">C</div>
            <input type="password" id="input-C" placeholder="" onclick="event.stopPropagation()">
            <button id="submit-C" onclick="checkPassword('C', event)"></button>
        </div>
        <div class="quest-block" id="block-D" onclick="handleBlockClick('D')">
            <div class="block-title">D</div>
            <input type="password" id="input-D" placeholder="" onclick="event.stopPropagation()">
            <button id="submit-D" onclick="checkPassword('D', event)"></button>
        </div>
    </div>

    <script>
        function decodeText(base64Str) {
            let cleaned = String(base64Str).replace(/\s/g, '').replace(/_/g, '/').replace(/-/g, '+');
            while (cleaned.length % 4 !== 0) cleaned += '=';
            const binary = atob(cleaned);
            const bytes = Uint8Array.from(binary, c => c.charCodeAt(0));
            return new TextDecoder('utf-8', { fatal: false }).decode(bytes);
        }

        const uiText = {
            confirm: "0JLRiyDRg9Cy0LXRgNC10L3Riz8=",
            yes: "0JTQsA==",
            no: "0J3QtdGC",
            reply: "0J7RgtCy0LXRgg==",
            alertErr: "0J3QtdCy0LXRgNC90YvQuSDQv9Cw0YDQvtC70YwuINCf0L7Qv9GA0L7QsdGD0LnRgtC1INGB0L3QvtCy0LAu",
            glitchVoice: "Li4u"
        };

        const linesEnc = [
            "0J_RgNC40LLQtdGC0YHRgtCy0YPRjg==",
            "0JLQvtGCINC80Ysg0Lgg0LLRgdGC0YDQtdGC0LjQu9C40YHRjCDQu9C40YbQvtC8INC6INC70LjRhtGD",
            "0K8g0YPQttC1INC00LDQstC90L4g0L3QsNCx0LvRjtC00LDRjiDQt9CwINCy0LDQvNC4",
            "0Jgg0LrQsNC6INCy0LjQttGDLCDQstGLINC20LDQttC00LXRgtC1INGD0LfQvdCw0YLRjCDQvtGC0LLQtdGC0Ys=",
            "0K8g0L_QvtC30LLQvtC70Y4g0LLQsNC8INGD0LfQvdCw0YLRjCDQvtGC0LLQtdGCLi4u",
            "0L3QviDRgtC-0LvRjNC60L4g0L3QsCDQvtC00LjQvSDQstC-0L_RgNC-0YE="
        ];

        const passwordsEnc = {
            A: "MTIxMzI=",

            C: "MTI3Mg==",
            D: "ODM0"
        };

        const npcAnswersEnc = {
            A: [
                "0JIg0YjRg9C80LUg0L3QtdGCINGB0LzRi9GB0LvQsC4",

                "0J7QvdCwINGF0L7RgtC10LvQsCDQvtGC0L7QvNGB0YLQuNGC0YwsINC90L4g0LbQsNC20LTQsCDQvNC10YHRgtC4INGB0L7QttCz0LvQsCDQtdGRLi4u",
            ],
            C: [
                "0K8g0LfQvdCw0Y4g0LLRgdGRINC-INGB0LLQvtC10Lkg0LLRgdC10LvQtdC90L3QvtC5Lg",
                "0K8g0L3QtSDRhdC-0YLQtdC7INGN0YLQuNGFINC30L3QsNC90LjQuS4uLg",

                "0K8g0L3QtSDRhdC-0YfRgywg0YfRgtC-0LHRiyDQstGLINGB0YDQsNC30YMg0YPQt9C90LDQu9C4INCy0YHQtSDQvtGC0LLQtdGC0Ysu",
                "0J_QvtGC0L7QvNGDINGH0YLQviDQstGB0LXQvNGDINGB0LLQvtGRINCy0YDQtdC80Y8uLi4",
            ],
            D: [
                "0KfRgtC-INCx0Ysg0L_QvtC70YPRh9C40YLRjCDQvtGC0LLQtdGC0Ysg0YHRgNCw0LfRgyDQvdCwINCy0YHRkSwg0L3Rg9C20L3QviDRgdC40LvRjNC90L4g0L_QvtGB0YLQsNGA0LDRgtGM0YHRjy4uLg",
                "0JLRiyDQvdC1INGB0YLQsNGA0LDQu9C40YHRjC4uLg",
                "0JTQu9GPINCy0LDRgSDRjdGC0L4g0LHRi9C70L4g0LvRkdCz0LrQvtC5INC_0YDQvtCz0YPQu9C60L7QuSwg0YLQsNC6INCy0LXQtNGMPw",
                "0KHRh9C40YLQsNC50YLQtSwg0YfRgtC-INCy0YHQtSDQstCw0YjQuCDRgdGC0LDRgNCw0L3QuNGPINCx0YvQu9C4INC90LDQv9GA0LDRgdC90Ysu",
                "0JrQsNC6INC90LjQutCw0Log0YMg0LLQsNGBINC-0YHRgtCw0LvQvtGB0Ywg0LzQvdC-0LPQviDRhdC-0YDQvtGI0LjRhSDQstC-0YHQv9C-0LzQuNC90LDQvdC40Lkg0L7QsSDRjdGC0L7QvCDQstGB0ZHQvC4",
                "0Jgg0LrQsNC6INCx0Ysg0LPRgNGD0YHRgtC90L4g0Y3RgtC-INC90LUg0LHRi9C70L4uLi4",

            ],
        };

        const speechPartsDEnc = [
            "0KfRgtC-INCx0Ysg0L_QvtC70YPRh9C40YLRjCDQvtGC0LLQtdGC0Ysg0YHRgNCw0LfRgyDQvdCwINCy0YHRkSwg0L3Rg9C20L3QviDRgdC40LvRjNC90L4g0L_QvtGB0YLQsNGA0LDRgtGM0YHRjy4uLg",
            "0JLRiyDQvdC1INGB0YLQsNGA0LDQu9C40YHRjC4uLg",
            "0JTQu9GPINCy0LDRgSDRjdGC0L4g0LHRi9C70L4g0LvRkdCz0LrQvtC5INC_0YDQvtCz0YPQu9C60L7QuSwg0YLQsNC6INCy0LXQtNGMPw",
            "0KHRh9C40YLQsNC50YLQtSwg0YfRgtC-INCy0YHQtSDQstCw0YjQuCDRgdGC0LDRgNCw0L3QuNGPINCx0YvQu9C4INC90LDQv9GA0LDRgdC90Ysu",
            "0JrQsNC6INC90LjQutCw0Log0YMg0LLQsNGBINC-0YHRgtCw0LvQvtGB0Ywg0LzQvdC-0LPQviDRhdC-0YDQvtGI0LjRhSDQstC-0YHQv9C-0LzQuNC90LDQvdC40Lkg0L7QsSDRjdGC0L7QvCDQstGB0ZHQvC4",
            "0Jgg0LrQsNC6INCx0Ysg0LPRgNGD0YHRgtC90L4g0Y3RgtC-INC90LUg0LHRi9C70L4uLi4",
            "0JLQsNGI0LUg0L_RgNC40LrQu9GO0YfQtdC90LjQtS4uLg",
            "0JXQqdCBINCd0JUg0JfQkNCa0J7QndCn0JXQndCeLg",
            "0J7QndCeINCX0JDQmtCe0J3Qp9CY0KLQodCvINCi0J7Qk9CU0JAsINCa0J7Qk9CU0JAg0KHQmtCQ0JbQoyDQry4"
        ];

        let currentLine = 0;
        let selectedBlock = null;
        let currentPartIndex = 0;

        function blinkEyes() {
            const leftEye = document.getElementById('left-eye');
            const rightEye = document.getElementById('right-eye');
            function doBlink() {
                leftEye.style.transform = 'scaleY(0)';
                rightEye.style.transform = 'scaleY(0)';
                setTimeout(() => {
                    leftEye.style.transform = 'scaleY(1)';
                    rightEye.style.transform = 'scaleY(1)';
                    setTimeout(doBlink, Math.random() * 3000 + 2000);
                }, 150);
            }
            setTimeout(doBlink, Math.random() * 3000 + 2000);
        }

        function typeText(text, elementId, callback) {
            const el = document.getElementById(elementId);
            if (!el) return;
            el.textContent = "";
            let i = 0;
            function type() {
                if (i < text.length) {
                    el.textContent += text.charAt(i++);
                    setTimeout(type, 40);
                } else if (callback) {
                    setTimeout(callback, 1500);
                }
            }
            type();
        }

        function runDialogue() {
            if (currentLine < linesEnc.length) {
                typeText(decodeText(linesEnc[currentLine]), "dialogue-box", () => {
                    currentLine++;
                    runDialogue();
                });
            } else {
                localStorage.setItem("arg_dialogue_finished", "true");
                showBlocks();
            }
        }

        function showBlocks() {
            document.getElementById("dialogue-box").textContent = "";
            document.getElementById("dialogue-box").style.display = "none";
            document.getElementById("confirm-screen").style.display = "none";
            document.getElementById("glitch-voice").style.display = "none";
            document.getElementById("blocks-wrapper").style.display = "grid";
        }

        function checkPassword(letter, event) {
            event.stopPropagation();
            const inputVal = document.getElementById(`input-${letter}`).value.trim();

            if (inputVal === decodeText(passwordsEnc[letter])) {
                localStorage.setItem(`arg_unlocked_${letter}`, "true");
                unlockBlockVisuals(letter);
            } else {
                alert(decodeText(uiText.alertErr));
                document.getElementById(`input-${letter}`).value = "";
            }
        }

        function unlockBlockVisuals(letter) {
            const block = document.getElementById(`block-${letter}`);
            if (block) block.classList.add("unlocked");
        }

        function handleBlockClick(letter) {
            const block = document.getElementById(`block-${letter}`);
            if (!block || !block.classList.contains("unlocked")) return;

            selectedBlock = letter;
            document.getElementById("blocks-wrapper").style.display = "none";
            document.getElementById("confirm-screen").style.display = "flex";
        }

        function finalDecision(isYes) {
            if (!isYes) {
                document.getElementById("confirm-screen").style.display = "none";
                document.getElementById("blocks-wrapper").style.display = "grid";
                selectedBlock = null;
                return;
            }

            localStorage.setItem("arg_final_choice", selectedBlock);
            document.getElementById("confirm-screen").style.display = "none";
            displayFinalAnswer(selectedBlock);
        }

        function hideEyesForOtherVoice() {
            const eyes = document.querySelector(".eyes-container");
            if (eyes) eyes.style.display = "none";
        }

        function showEyesForNormalVoice() {
            const eyes = document.querySelector(".eyes-container");
            if (eyes) eyes.style.display = "flex";
        }

        function typeAnswerParts(parts, index = 0, specialClass = "") {
            const dialogue = document.getElementById("dialogue-box");
            if (!dialogue || index >= parts.length) return;
            dialogue.className = "dialogue-container" + (specialClass ? " " + specialClass : "");
            dialogue.style.display = "block";
            typeText(decodeText(parts[index]), "dialogue-box", () => {
                if (index + 1 < parts.length) {
                    setTimeout(() => typeAnswerParts(parts, index + 1, specialClass), 500);
                }
            });
        }

        function typeSpeechDParts(index = 0) {
            const parts = npcAnswersEnc.D;
            const dialogue = document.getElementById("dialogue-box");
            if (!dialogue || index >= parts.length) return;
            if (index >= parts.length - 2) {
                hideEyesForOtherVoice();
                dialogue.className = "dialogue-container other-voice";
            } else {
                showEyesForNormalVoice();
                dialogue.className = "dialogue-container";
            }
            dialogue.style.display = "block";
            typeText(decodeText(parts[index]), "dialogue-box", () => {
                if (index + 1 < parts.length) setTimeout(() => typeSpeechDParts(index + 1), 500);
            });
        }

        function displayFinalAnswer(letter) {
            document.getElementById("blocks-wrapper").style.display = "none";
            document.getElementById("confirm-screen").style.display = "none";
            const dialogue = document.getElementById("dialogue-box");
            dialogue.className = "dialogue-container";
            dialogue.style.display = "block";
            if (letter === 'D') {
                currentPartIndex = 0;
                typeSpeechDParts();
            } else if (npcAnswersEnc[letter]) {
                showEyesForNormalVoice();
                typeAnswerParts(npcAnswersEnc[letter]);
            }
        }

        function initInterfaceText() {
            document.getElementById("confirm-label").innerText = decodeText(uiText.confirm);
            document.getElementById("btn-yes").innerText = decodeText(uiText.yes);
            document.getElementById("btn-no").innerText = decodeText(uiText.no);
            document.getElementById("glitch-voice").innerText = decodeText(uiText.glitchVoice);
            ['A', 'B', 'C', 'D'].forEach(letter => {
                const btn = document.getElementById(`submit-${letter}`);
                if (btn) btn.innerText = decodeText(uiText.reply);
            });
        }

        window.onload = function() {
            initInterfaceText();
            blinkEyes();

            const savedChoice = localStorage.getItem("arg_final_choice");
            if (savedChoice) {
                displayFinalAnswer(savedChoice);
                return;
            }

            ['A', 'B', 'C', 'D'].forEach(letter => {
                const input = document.getElementById(`input-${letter}`);
                if (localStorage.getItem(`arg_unlocked_${letter}`) === "true") {
                    unlockBlockVisuals(letter);
                } else if (input) {
                    input.value = "";
                    input.addEventListener("keydown", (event) => {
                        if (event.key === "Enter") checkPassword(letter, event);
                    });
                    input.addEventListener("input", () => {
                        if (input.value.trim() === decodeText(passwordsEnc[letter])) {
                            checkPassword(letter, { stopPropagation: () => {} });
                        }
                    });
                }
            });

            if (localStorage.getItem("arg_dialogue_finished") === "true") {
                showBlocks();
            } else {
                runDialogue();
            }
        };
    </script>
</body>
</html>
