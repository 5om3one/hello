<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>Hello</title>
    <style>
        body {
            background-color: #000;
            color: #fff;
            font-family: monospace;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            margin: 0;
            overflow: hidden;
            user-select: none;
        }

        .eyes-container {
            display: flex;
            justify-content: space-between;
            width: 140px;
            margin-bottom: 40px;
        }
        .eye {
            width: 35px;
            height: 35px;
            background-color: #fff;
            border-radius: 50%;
            transition: transform 0.1s scaleY;
        }

        .dialogue-container {
            font-size: 20px;
            text-align: center;
            max-width: 650px;
            height: 80px;
            margin-bottom: 40px;
            line-height: 1.5;
        }

        .blocks-container {
            display: none;
            grid-template-columns: repeat(2, 1fr);
            gap: 20px;
            width: 90%;
            max-width: 500px;
        }
        .quest-block {
            background-color: #222;
            border: 2px solid #444;
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 12px;
            cursor: default;
            transition: background-color 0.3s, border-color 0.3s;
        }
        .quest-block .block-title {
            font-size: 24px;
            font-weight: bold;
            color: #888;
        }
        
        .quest-block input {
            background: #111;
            border: 1px solid #555;
            color: #fff;
            padding: 6px;
            font-family: monospace;
            text-align: center;
            width: 80%;
            font-size: 14px;
        }
        .quest-block button {
            background: #333;
            border: 1px solid #555;
            color: #fff;
            cursor: pointer;
            font-family: monospace;
            padding: 5px 12px;
        }
        .quest-block button:hover { background: #444; }

        .quest-block.unlocked {
            background-color: #000;
            border-color: #fff;
            cursor: pointer;
        }
        .quest-block.unlocked .block-title {
            color: #fff;
        }
        .quest-block.unlocked input, 
        .quest-block.unlocked button {
            display: none;
        }

        .overlay-screen {
            display: none;
            flex-direction: column;
            align-items: center;
            gap: 25px;
        }
        .confirm-text {
            font-size: 24px;
            letter-spacing: 2px;
        }
        .buttons-group {
            display: flex;
            gap: 40px;
        }
        .action-btn {
            background: none;
            border: 2px solid #fff;
            color: #fff;
            font-family: monospace;
            font-size: 20px;
            padding: 8px 25px;
            cursor: pointer;
            transition: background 0.2s, color 0.2s;
        }
        .action-btn:hover {
            background: #fff;
            color: #000;
        }

        #glitch-voice {
            color: #ff0000;
            font-weight: bold;
            font-size: 24px;
            text-shadow: 0 0 10px #ff0000;
            display: none;
            text-align: center;
        }
    </style>
    <script src="https://cloudflare.com"></script>
</head>
<body>

    <div class="eyes-container">
        <div class="eye" id="left-eye"></div>
        <div class="eye" id="right-eye"></div>
    </div>

    <div class="dialogue-container" id="dialogue-box"></div>

    <div class="overlay-screen" id="confirm-screen">
        <div class="confirm-text">Вы уверены?</div>
        <div class="buttons-group">
            <button class="action-btn" onclick="finalDecision(true)">Да</button>
            <button class="action-btn" onclick="finalDecision(false)">Нет</button>
        </div>
    </div>

    <div id="glitch-voice">ЕЩЁ НЕ ОКОНЧЕНО.</div>

    <div class="blocks-container" id="blocks-wrapper">
        <div class="quest-block" id="block-A" onclick="handleBlockClick('A')">
            <div class="block-title">A</div>
            <input type="password" id="input-A" placeholder="" onclick="event.stopPropagation()">
            <button onclick="checkPassword('A', event)">Ответить</button>
        </div>
        <div class="quest-block" id="block-B" onclick="handleBlockClick('B')">
            <div class="block-title">B</div>
            <input type="password" id="input-B" placeholder="" onclick="event.stopPropagation()">
            <button onclick="checkPassword('B', event)">Ответить</button>
        </div>
        <div class="quest-block" id="block-C" onclick="handleBlockClick('C')">
            <div class="block-title">C</div>
            <input type="password" id="input-C" placeholder="" onclick="event.stopPropagation()">
            <button onclick="checkPassword('C', event)">Ответить</button>
        </div>
        <div class="quest-block" id="block-D" onclick="handleBlockClick('D')">
            <div class="block-title">D</div>
            <input type="password" id="input-D" placeholder="" onclick="event.stopPropagation()">
            <button onclick="checkPassword('D', event)">Ответить</button>
        </div>
    </div>

    <script>
        const lines = [
            "Приветствую",
            "Вот мы и встретились лицом к лицу",
            "Я уже давно наблюдаю за вами",
            "И как вижу, вы жаждаете узнать ответы",
            "Я позволю вам узнать ответ...",
            "но только на один вопрос"
        ];

        const passwords = { A: "12132", B: "7658", C: "1272", D: "834" };

        const npcAnswers = {
            A: "В шуме нету смысла. Это просто шум... Иногда нет смысла искать логику в случайных вещах...",
            B: "Ирен — это дитя, рожденное под несчастливой звездой 29 февраля 1844 года. Беспокойная душа, застрявшая в пламени собственной мести...",
            C: "Я знаю всё о своей вселенной. Но мне не нужны были эти знания. Я здесь лишь для того, что бы не позволить вам получить эти знания... Вам это не понравится..."
        };

        const speechPartsD = [
            "Что бы получить ответы, надо сильно постараться",
            "А вы не очень-то и напряглись...",
            "...",
            "Вы можете подумать, что весь проделанный вами путь бессмыслен и в целом, так и есть",
            "Но только подумайте, сколько эмоций вы получили, сколько завели новых друзей, разве это того не стоит?",
            "Хоть вы и потратили время, в ожидании ответов, вы всё же никогда не забудете как решали эту загадку.",
            "И да... Как бы это не было грустно, но ваше путешествие..."
        ];

        let currentLine = 0;
        let selectedBlock = null;
        let currentPartIndex = 0;

        function blinkEyes() {
            const leftEye = document.getElementById('left-eye');
            const rightEye = document.getElementById('right-eye');
            
            setInterval(() => {
                leftEye.style.transform = 'scaleY(0)';
                rightEye.style.transform = 'scaleY(0)';
                setTimeout(() => {
                    leftEye.style.transform = 'scaleY(1)';
                    rightEye.style.transform = 'scaleY(1)';
                }, 150);
            }, Math.random() * 3000 + 2000);
        }

        function typeText(text, elementId, callback) {
            const el = document.getElementById(elementId);
            el.innerHTML = "";
            let i = 0;
            function type() {
                if (i < text.length) {
                    el.innerHTML += text.charAt(i);
                    i++;
                    setTimeout(type, 40);
                } else if (callback) {
                    setTimeout(callback, 1500);
                }
            }
            type();
        }

        function runDialogue() {
            if (currentLine < lines.length) {
                typeText(lines[currentLine], "dialogue-box", () => {
                    currentLine++;
                    runDialogue();
                });
            } else {
                localStorage.setItem("arg_dialogue_finished", "true");
                showBlocks();
            }
        }

        function showBlocks() {
            document.getElementById("dialogue-box").innerHTML = "";
            document.getElementById("blocks-wrapper").style.display = "grid";
        }

        function checkPassword(letter, event) {
            event.stopPropagation();
            const inputVal = document.getElementById(`input-${letter}`).value.trim();

            if (inputVal === passwords[letter]) {
                localStorage.setItem(`arg_unlocked_${letter}`, "true");
                unlockBlockVisuals(letter);
            } else {
                alert("Доступ запрещен. Неверный ключ.");
                document.getElementById(`input-${letter}`).value = "";
            }
        }

        function unlockBlockVisuals(letter) {
            const block = document.getElementById(`block-${letter}`);
            if (block) {
                block.classList.add("unlocked");
            }
        }

        function handleBlockClick(letter) {
            const block = document.getElementById(`block-${letter}`);
            if (!block || !block.classList.contains("unlocked")) return;

            selectedBlock = letter;
            document.getElementById("blocks-wrapper").style.display = "none";
            document.getElementById("confirm-screen").style.display = "flex";
        }

        function finalDecision(isYes) {
            if (!isYes) {
                document.getElementById("confirm-screen").style.display = "none";
                document.getElementById("blocks-wrapper").style.display = "grid";
                selectedBlock = null;
                return;
            }

            localStorage.setItem("arg_final_choice", selectedBlock);
            document.getElementById("confirm-screen").style.display = "none";
            displayFinalAnswer(selectedBlock);
        }

        function typeSpeechDParts() {
            if (currentPartIndex < speechPartsD.length) {
                typeText(speechPartsD[currentPartIndex], "dialogue-box", () => {
                    setTimeout(() => {
                        currentPartIndex++;
                        typeSpeechDParts();
                    }, 2500);
                });
            } else {
                setTimeout(() => {
                    const eyes = document.querySelector(".eyes-container");
                    if (eyes) eyes.style.display = "none";
                    document.getElementById("dialogue-box").style.display = "none";

                    document.getElementById("glitch-voice").style.display = "block";
                }, 4000);
            }
        }

        function displayFinalAnswer(letter) {
            if (letter === 'D') {
                currentPartIndex = 0;
                typeSpeechDParts();
            } else {
                typeText(npcAnswers[letter], "dialogue-box");
            }
        }

        window.onload = function() {
            blinkEyes();

            const savedChoice = localStorage.getItem("arg_final_choice");
            if (savedChoice) {
                displayFinalAnswer(savedChoice);
                return;
            }

            ['A', 'B', 'C', 'D'].forEach(letter => {
                if (localStorage.getItem(`arg_unlocked_${letter}`) === "true") {
                    unlockBlockVisuals(letter);
                }
            });

            if (localStorage.getItem("arg_dialogue_finished") === "true") {
                showBlocks();
            } else {
                runDialogue();
            }
        };
    </script>
</body>
</html>
